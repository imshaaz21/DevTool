name: CI

on:
  push:
    branches: [ main, master, v2 ]
  pull_request:
    branches: [ main, master, v2 ]

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run linter
      run: npm run lint

    - name: Run tests with coverage
      run: npm run test:coverage -- --ci --maxWorkers=2

    - name: Build project
      run: npm run build
      env:
        SKIP_ENV_VALIDATION: true
        NEXT_TELEMETRY_DISABLED: 1

    - name: Upload coverage reports (Node 20.x only)
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7
        if-no-files-found: ignore

    - name: SonarCloud Scan (Node 20.x only)
      if: matrix.node-version == '20.x'
      uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      continue-on-error: true
      with:
        args: >
          -Dsonar.projectKey=imshaaz21_DevTool
          -Dsonar.organization=imshaaz21
